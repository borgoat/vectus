name: CI

on:
  push:
    branches: [development]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.cc }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cc: gcc }
          - { os: ubuntu-24.04, cc: clang }
          - { os: macos-15, cc: clang }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev check pkg-config
          else
            brew install check pkg-config
          fi
      - run: cmake -B build -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Fail if the tests would run without sanitizers
        run: grep -q '^VECTUS_HAVE_SANITIZERS:INTERNAL=1$' build/CMakeCache.txt
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev check pkg-config
      - run: cmake -B build && cmake --build build
      # Not a services: block, which cannot pass tusd its -max-size flag or wire up the proxy
      - name: Start tusd and Toxiproxy
        run: tests/e2e-env.sh >> "$GITHUB_ENV"
      - name: Run the tests, including the live and resume ones
        shell: bash
        run: |
          ctest --test-dir build --output-on-failure --verbose | tee ctest.log
          # ctest passes the same when live tests are skipped, so check each one really ran
          for test in test_vectus_client_init test_upload_live test_upload_live_small test_upload_live_deferred \
                      test_upload_live_concatenation test_upload_live_method_override \
                      test_upload_live_empty test_upload_live_resume \
                      test_upload_live_length_mismatch test_upload_live_gone test_upload_live_too_large \
                      test_resume_after_cut test_resume_deferred_after_cut test_resume_after_stall test_resume_repeatedly; do
            grep -q ":$test:0: Passed" ctest.log || { echo "$test did not pass"; exit 1; }
          done
        env:
          CK_VERBOSITY: verbose

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang libcurl4-openssl-dev pkg-config
      - run: |
          # shellcheck disable=SC2046 # pkg-config output must split into separate flags
          clang -g -Wall -Wextra -Wpedantic -Werror -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all -Iinclude fuzz/header.c $(pkg-config --cflags --libs libcurl) -o fuzz-header
      # shortcut: a fixed 60s run with no saved corpus; move to ClusterFuzzLite when findings need tracking across runs
      - run: ./fuzz-header -dict=fuzz/header.dict -max_total_time=60
